<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loop Engineering 架构图画廊</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --ink: #17202b;
      --muted: #66717d;
      --soft: #8a95a3;
      --line: #dce3ea;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --rail: #e9eef4;
      --red: #d9262e;
      --teal: #0f766e;
      --blue: #1f6feb;
      --amber: #b7791f;
      --shadow: 0 18px 48px rgba(26, 36, 49, 0.12);
      --tight-shadow: 0 8px 22px rgba(26, 36, 49, 0.07);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      background:
        linear-gradient(180deg, #ffffff 0, #f7f9fb 230px, var(--bg) 620px),
        var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      font-size: 15px;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
      letter-spacing: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .top {
      display: none;
    }

    .top-inner {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 22px;
      align-items: center;
      width: min(1540px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 16px 0;
    }

    .brand {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.15;
      font-weight: 760;
    }

    .subtitle {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 9px;
    }

    .field,
    .select,
    .button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
    }

    .field {
      width: min(300px, 30vw);
      padding: 0 12px;
    }

    .select {
      padding: 0 10px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      cursor: pointer;
    }

    .button:hover,
    .field:focus,
    .select:focus {
      border-color: #b7c2cf;
      outline: none;
    }

    .wrap {
      width: calc(100vw - 28px);
      height: 100%;
      min-height: 0;
      margin: 0 auto;
    }

    .overview {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 24px;
      align-items: end;
      padding: 34px 0 24px;
    }

    .intro {
      max-width: 850px;
    }

    .kicker {
      color: var(--red);
      font-size: 13px;
      font-weight: 700;
    }

    .intro h2 {
      margin: 9px 0 10px;
      font-size: clamp(30px, 5vw, 58px);
      line-height: 1.04;
      font-weight: 780;
    }

    .intro p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 112px);
      gap: 10px;
    }

    .metric {
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--tight-shadow);
    }

    .metric strong {
      display: block;
      font-size: 24px;
      line-height: 1;
    }

    .metric span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .navline {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 0 22px;
    }

    .navline a {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: #384454;
      font-size: 13px;
      box-shadow: 0 5px 16px rgba(26, 36, 49, 0.05);
    }

    .navline a:hover {
      border-color: #b7c2cf;
    }

    .status {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      align-items: center;
      padding: 10px 0 28px;
      color: var(--muted);
      font-size: 13px;
    }

    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #24a064;
      box-shadow: 0 0 0 5px rgba(36, 160, 100, 0.14);
    }

    .story-section {
      margin-bottom: 42px;
      scroll-margin-top: 96px;
    }

    .section-head {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 18px;
      align-items: end;
      padding: 24px 0 16px;
      border-top: 1px solid var(--line);
    }

    .section-head h2 {
      margin: 0;
      font-size: 30px;
      line-height: 1.15;
      font-weight: 760;
    }

    .section-head p {
      margin: 8px 0 0;
      max-width: 760px;
      color: var(--muted);
      line-height: 1.6;
    }

    .section-index {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--red);
      font-weight: 780;
      box-shadow: var(--tight-shadow);
    }

    .phase {
      margin: 18px 0 26px;
    }

    .phase-head {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 12px;
    }

    .phase-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      font-weight: 760;
    }

    .phase[data-phase="logic"] .phase-mark {
      background: var(--blue);
    }

    .phase[data-phase="runtime"] .phase-mark {
      background: var(--teal);
    }

    .phase[data-phase="development"] .phase-mark {
      background: var(--amber);
    }

    .phase-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 730;
    }

    .phase-subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .diagram-stack {
      display: grid;
      gap: 22px;
    }

    .diagram {
      overflow: visible;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--tight-shadow);
    }

    .diagram-page {
      height: calc(100vh - 96px);
      scroll-margin-top: 92px;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
    }

    .canvas {
      position: relative;
      display: block;
      min-height: 0;
      height: 100%;
      padding: 20px;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.76), rgba(248, 250, 252, 0.94)),
        repeating-linear-gradient(0deg, transparent, transparent 23px, rgba(28, 42, 59, 0.04) 24px),
        repeating-linear-gradient(90deg, transparent, transparent 23px, rgba(28, 42, 59, 0.04) 24px);
      cursor: zoom-in;
    }

    .canvas img {
      position: absolute;
      inset: 20px;
      display: block;
      width: calc(100% - 40px);
      height: calc(100% - 40px);
      object-fit: contain;
    }

    .diagram-foot {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
    }

    .diagram-name {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 680;
    }

    .diagram-path {
      margin: 5px 0 0;
      overflow-wrap: anywhere;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .open-detail {
      min-width: 82px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
      color: #354150;
      cursor: pointer;
    }

    .open-detail:hover {
      border-color: #b7c2cf;
      background: #fff;
    }

    .empty {
      display: none;
      padding: 56px 20px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      text-align: center;
    }

    .overview,
    .navline,
    .status {
      display: none;
    }

    #gallery {
      height: 100%;
      box-sizing: border-box;
      padding: 10px 0;
    }

    .deck {
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
    }

    .deck-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--tight-shadow);
    }

    .slide-kicker {
      margin: 0 0 5px;
      color: var(--red);
      font-size: 12px;
      line-height: 1;
      font-weight: 760;
    }

    .slide-heading {
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 760;
    }

    .deck-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slide-count {
      min-width: 64px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 730;
      text-align: center;
    }

    .deck-button {
      width: 38px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
      color: var(--ink);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }

    .detail-button {
      width: auto;
      min-width: 58px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 650;
    }

    .deck-button:hover {
      border-color: #b7c2cf;
      background: #fff;
    }

    .slide-main {
      position: relative;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
      gap: 14px;
    }

    .slide-main.is-wide {
      grid-template-columns: minmax(0, 1fr);
    }

    .slide-figure,
    .slide-notes,
    .deck-foot {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--tight-shadow);
    }

    .slide-figure {
      position: relative;
      min-height: 0;
      padding: 16px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(248, 250, 252, 0.96)),
        repeating-linear-gradient(0deg, transparent, transparent 23px, rgba(28, 42, 59, 0.04) 24px),
        repeating-linear-gradient(90deg, transparent, transparent 23px, rgba(28, 42, 59, 0.04) 24px);
      cursor: zoom-in;
    }

    .slide-figure img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .slide-notes {
      min-height: 0;
      padding: 18px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .slide-main.is-wide .slide-notes {
      display: none;
    }

    .slide-main.is-wide .slide-notes h3 {
      font-size: 14px;
    }

    .slide-main.is-wide .slide-notes p,
    .slide-main.is-wide .note-list li {
      font-size: 12px;
      line-height: 1.5;
    }

    .slide-notes h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.3;
    }

    .slide-notes p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .note-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .note-list li {
      position: relative;
      padding-left: 13px;
      color: #354150;
      font-size: 13px;
      line-height: 1.58;
    }

    .note-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.72em;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--red);
    }

    .deck-foot {
      display: none;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
    }

    .deck-path {
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
    }

    .viewer {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 80;
      background: rgba(13, 18, 26, 0.9);
    }

    .viewer.open {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .viewer-bar {
      display: grid;
      grid-template-columns: minmax(160px, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 12px 16px;
      background: rgba(7, 11, 17, 0.72);
      color: #fff;
    }

    .viewer-title {
      min-width: 0;
    }

    .viewer-title strong,
    .viewer-title span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .viewer-title span {
      margin-top: 4px;
      color: rgba(255, 255, 255, 0.66);
      font-size: 12px;
    }

    .viewer-actions {
      display: flex;
      gap: 8px;
    }

    .viewer-actions button {
      height: 36px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      cursor: pointer;
    }

    .stage {
      overflow: auto;
      cursor: grab;
    }

    .stage.dragging {
      cursor: grabbing;
    }

    .stage-inner {
      display: grid;
      place-items: center;
      min-width: 100%;
      min-height: 100%;
      padding: 30px;
    }

    .stage img {
      max-width: none;
      transform-origin: center center;
      background: #fff;
      box-shadow: var(--shadow);
      user-select: none;
      -webkit-user-drag: none;
    }

    @media (max-width: 900px) {
      .top-inner,
      .overview,
      .section-head {
        grid-template-columns: 1fr;
      }

      .toolbar {
        justify-content: stretch;
      }

      .field,
      .select,
      .button {
        width: 100%;
      }

      .metrics {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .diagram-page {
        height: calc(100vh - 86px);
      }

      .canvas {
        min-height: 0;
      }

      .viewer-bar {
        grid-template-columns: 1fr;
      }

      .viewer-actions {
        overflow-x: auto;
      }
    }

    @media (max-width: 560px) {
      .top-inner,
      .wrap {
        width: min(100vw - 24px, 1540px);
      }

      .overview {
        padding-top: 24px;
      }

      .intro h2 {
        font-size: 34px;
      }

      .metrics {
        grid-template-columns: 1fr;
      }

      .diagram-foot {
        grid-template-columns: 1fr;
      }

      .canvas {
        padding: 12px;
      }

      .canvas img {
        inset: 12px;
        width: calc(100% - 24px);
        height: calc(100% - 24px);
      }

      .open-detail {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <h1>Loop Engineering 架构图画廊</h1>
        <div class="subtitle">以用例为纲，按逻辑视图、运行视图、开发视图阅读；双击图片或点“看细节”进入放大预览。</div>
      </div>
      <div class="toolbar">
        <input id="search" class="field" type="search" placeholder="搜索用例、视图或文件名">
        <select id="interval" class="select" title="自动刷新间隔">
          <option value="1000">1 秒刷新</option>
          <option value="2000" selected>2 秒刷新</option>
          <option value="5000">5 秒刷新</option>
          <option value="0">暂停刷新</option>
        </select>
        <button id="refresh" class="button" type="button">立即刷新</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="overview" aria-label="页面概览">
      <div class="intro">
        <div class="kicker">Draw.io Export Review</div>
        <h2>从用例故事线直接阅读架构图</h2>
        <p>页面会持续刷新同名导出图片，适合一边重新导出 draw.io，一边在浏览器里看布局变化。默认大图展示已经按阅读尺度排版，放大预览用于检查细节和文字边界。</p>
      </div>
      <div class="metrics">
        <div class="metric"><strong id="metricSections">3</strong><span>阅读分组</span></div>
        <div class="metric"><strong id="metricImages">13</strong><span>导出图片</span></div>
        <div class="metric"><strong>2s</strong><span>默认刷新</span></div>
      </div>
    </section>

    <nav class="navline" aria-label="页面导航">
      <a href="#use-case">用例总览</a>
      <a href="#uc01">UC01</a>
      <a href="#uc02">UC02</a>
      <a href="#uc01-logic">UC01 逻辑</a>
      <a href="#uc01-runtime">UC01 运行</a>
      <a href="#uc01-development">UC01 开发</a>
      <a href="#uc02-logic">UC02 逻辑</a>
      <a href="#uc02-runtime">UC02 运行</a>
      <a href="#uc02-development">UC02 开发</a>
    </nav>

    <div class="status">
      <span class="pulse" aria-hidden="true"></span>
      <span id="count"></span>
      <span id="lastRefresh"></span>
    </div>

    <div id="gallery"></div>
    <div id="empty" class="empty">没有匹配的架构图。</div>
  </main>

  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="图片预览">
    <div class="viewer-bar">
      <div class="viewer-title">
        <strong id="viewerName"></strong>
        <span id="viewerPath"></span>
      </div>
      <div class="viewer-actions">
        <button id="zoomOut" type="button">缩小</button>
        <button id="zoomFit" type="button">适应</button>
        <button id="zoomIn" type="button">放大</button>
        <button id="openFile" type="button">新标签打开</button>
        <button id="closeViewer" type="button">关闭</button>
      </div>
    </div>
    <div id="stage" class="stage">
      <div class="stage-inner">
        <img id="viewerImage" alt="">
      </div>
    </div>
  </div>

  <script>
    const sections = [
      {
        id: 'use-case',
        index: '00',
        title: '用例总览',
        summary: '先看系统面向人的入口和用例目录，再进入具体用例的逻辑、运行与开发视图。',
        phases: [
          {
            id: 'use-case-overview',
            type: 'logic',
            title: '用例视图',
            subtitle: '全局用例与目录视图',
            items: [
              { path: 'use-case/exports/use-case-view.webp', title: 'use-case-view.png', featured: true },
              { path: 'use-case/exports/use-case-catalog-view.webp', title: 'use-case-catalog-view.png' }
            ]
          }
        ]
      },
      {
        id: 'uc01',
        index: '01',
        title: 'UC01',
        summary: '围绕 loop-init 初始化链路阅读：先理解模块逻辑，再看运行路径，最后落到开发视图。',
        phases: [
          {
            id: 'uc01-logic',
            type: 'logic',
            title: '逻辑视图',
            subtitle: '模块边界与核心职责',
            items: [
              { path: 'UC01/logic/exports/logic-view.webp', title: 'logic-view.png', featured: true }
            ]
          },
          {
            id: 'uc01-runtime',
            type: 'runtime',
            title: '运行视图',
            subtitle: '初始化、人工选型、成本反馈三条运行链路',
            items: [
              { path: 'UC01/runtime/exports/loop-init 脚手架路径.webp', title: 'loop-init 脚手架路径.png' },
              { path: 'UC01/runtime/exports/人工选型与边界设计.webp', title: '人工选型与边界设计.png' },
              { path: 'UC01/runtime/exports/成本估算与 readiness 反馈.webp', title: '成本估算与 readiness 反馈.png' }
            ]
          },
          {
            id: 'uc01-development',
            type: 'development',
            title: '开发视图',
            subtitle: '代码组织和可维护边界',
            items: [
              { path: 'UC01/development/exports/development-view.webp', title: 'development-view.png', featured: true }
            ]
          }
        ]
      },
      {
        id: 'uc02',
        index: '02',
        title: 'UC02',
        summary: '围绕周期运行机制阅读：对比不同 Agent runtime 与 GitHub Actions 的定时触发路径。',
        phases: [
          {
            id: 'uc02-logic',
            type: 'logic',
            title: '逻辑视图',
            subtitle: '周期运行能力的逻辑分层',
            items: [
              { path: 'UC02/logic/exports/logic-view.webp', title: 'logic-view.png', featured: true }
            ]
          },
          {
            id: 'uc02-runtime',
            type: 'runtime',
            title: '运行视图',
            subtitle: 'Claude、Codex、Grok、GitHub Actions 与 PR Babysitter 打穿路径',
            items: [
              { path: 'UC02/runtime/exports/Claude `-loop` 周期运行.webp', title: 'Claude `-loop` 周期运行.png' },
              { path: 'UC02/runtime/exports/Codex Automations 周期运行.webp', title: 'Codex Automations 周期运行.png' },
              { path: 'UC02/runtime/exports/Codex PR Babysitter tick.webp', title: 'Codex PR Babysitter tick.png' },
              { path: 'UC02/runtime/exports/Grok `-loop` 周期运行.webp', title: 'Grok `-loop` 周期运行.png' },
              { path: 'UC02/runtime/exports/GitHub Actions 事件 - 定时运行.webp', title: 'GitHub Actions 事件 - 定时运行.png' }
            ]
          },
          {
            id: 'uc02-development',
            type: 'development',
            title: '开发视图',
            subtitle: '周期运行相关工程结构',
            items: [
              { path: 'UC02/development/exports/development-view.webp', title: 'development-view.png', featured: true },
              { path: 'UC02/development/exports/pr-babysitter-development-view-with-code.webp', title: 'pr-babysitter-development-view-with-code.png', fullBleed: true }
            ]
          }
        ]
      }
    ];

    const phaseLabels = {
      logic: '逻',
      runtime: '运',
      development: '开'
    };

    const gallery = document.querySelector('#gallery');
    const empty = document.querySelector('#empty');
    const search = document.querySelector('#search');
    const count = document.querySelector('#count');
    const lastRefresh = document.querySelector('#lastRefresh');
    const intervalSelect = document.querySelector('#interval');
    const refreshButton = document.querySelector('#refresh');
    const viewer = document.querySelector('#viewer');
    const viewerName = document.querySelector('#viewerName');
    const viewerPath = document.querySelector('#viewerPath');
    const viewerImage = document.querySelector('#viewerImage');
    const stage = document.querySelector('#stage');
    let refreshTimer = null;
    let currentImage = null;
    let currentSlide = 0;
    let filteredSlides = [];
    let zoom = 1;

    function allImages() {
      return sections.flatMap((section) => section.phases.flatMap((phase) => phase.items));
    }

    function cacheBusted(path) {
      return encodeURI(path) + '?refresh=' + Date.now();
    }

    function searchableText(section, phase, item) {
      return [section.title, section.summary, phase.title, phase.subtitle, item.title, item.path].join(' ').toLowerCase();
    }

    function notesFor(section, phase, item) {
      const path = item.path;
      if (path.includes('use-case-view')) {
        return ['这页先看系统边界和角色，不展开实现细节。', 'UC01/UC02 是后续逻辑、运行、开发视图的索引。', '如果只想追某个用例，直接翻到对应 UC 分组即可。'];
      }
      if (path.includes('use-case-catalog')) {
        return ['目录页用于确认用例编号、参与者、入口面和优先级。', 'UC02「执行 Loop」是本次运行链路和周期执行图的主线。', '说明列保留了模式、工具和触发方式的归并依据。'];
      }
      if (phase.type === 'logic' && section.id === 'uc01') {
        return ['重点看“定义 Loop”被拆成哪些稳定职责。', '从模式选择到脚手架生成，再到预算/readiness，是一条配置控制链。', '不要把它当运行时顺序图读，这页解释的是责任边界。'];
      }
      if (phase.type === 'logic' && section.id === 'uc02') {
        return ['重点看入口面、Loop 编排、执行资产与外部工作系统四层。', '图中没有把 7 个 pattern 展开成 7 个系统，因为它们共享同一运行契约。', '隐藏的细关系仍保留在 JSON/evidence 中，图面优先保证主结构可读。'];
      }
      if (phase.type === 'development' && section.id === 'uc01') {
        return ['这页回答开发者要维护哪些模块来完成 Loop 定义。', '关注 loop-init、registry、starter/template、audit/cost 之间的依赖。', '图上的长卡片是开发视图特意保留的责任和接口摘要。'];
      }
      if (phase.type === 'development' && section.id === 'uc02') {
        if (path.includes('pr-babysitter-development-view-with-code')) {
          return ['这页专门回答“让 Agent loop 起来到底写了什么、涉及哪些代码”。', '每个卡片都有“涉及代码”栏，优先列开发者会打开的 prompt/config/skill/template/CLI 文件。', 'minimal-fix 在 starter 的 .codex 目录里缺失，图中按模板与 loop-init 补齐路径表达。'];
        }
        return ['这页回答开发者要维护哪些资产来支撑 Loop 执行。', 'Pattern Registry、Runtime Surface Examples、Actions Harness 和 Control Contract 是主线。', 'GitHub Actions 的真实 agent 调用仍停在 harness 边界，图中按保守依赖表达。'];
      }
      if (path.includes('Codex PR Babysitter tick')) {
        return ['这页是 PR Babysitter 的具体打穿路径，不是泛化的 Codex Automation。', '定时器只触发一个主 Agent run；worktree、minimal-fix、verifier 都是主 run 的条件分支。', '闭环止于 PR 评论、状态回写与人工门禁，图中没有自动 merge 路径。'];
      }
      if (path.includes('GitHub Actions')) {
        return ['这页强调 CI 事件、定时器与外部 runner / dispatch 的责任边界。', 'workflow 内的 agent 调用在仓库里仍是占位 wiring，因此相关路径偏约定化。', '看点是 Actions 只负责触发和上下文，执行可委派给 Codex CLI、dispatch 或自定义 harness。'];
      }
      if (phase.type === 'runtime') {
        return ['这页按泳道读：触发者、运行面、Loop 合约、执行器、状态/预算、反馈面。', '虚线分支通常表示可选修复、verifier 或外派执行路径。', '运行图不是目录结构，重点是一次 Loop 如何从触发走到回写和人工复核。'];
      }
      return [section.summary, phase.subtitle, '双击图片或点击“看细节”可以进入放大检查模式。'];
    }

    function buildSlides() {
      const term = search.value.trim().toLowerCase();
      return sections.flatMap((section) => section.phases.flatMap((phase) => {
        return phase.items
          .filter((item) => !term || searchableText(section, phase, item).includes(term))
          .map((item) => ({ section, phase, item }));
      }));
    }

    function showSlide(index) {
      if (!filteredSlides.length) return;
      currentSlide = (index + filteredSlides.length) % filteredSlides.length;
      const { section, phase, item } = filteredSlides[currentSlide];
      const notes = notesFor(section, phase, item);
      gallery.querySelector('.deck').innerHTML = `
        <div class="deck-top">
          <div>
            <p class="slide-kicker">${section.index} / ${section.title} / ${phase.title}</p>
            <h2 class="slide-heading">${item.title}</h2>
          </div>
          <div class="deck-controls">
            <button class="deck-button" id="slidePrev" type="button" aria-label="上一页">‹</button>
            <span class="slide-count">${currentSlide + 1} / ${filteredSlides.length}</span>
            <button class="deck-button" id="slideNext" type="button" aria-label="下一页">›</button>
            <button class="deck-button detail-button" id="slideDetail" type="button">细节</button>
          </div>
        </div>
        <div class="slide-main">
          <div class="slide-figure" title="双击查看细节">
            <img class="slide-image" src="${cacheBusted(item.path)}" alt="${item.title}" data-path="${item.path}">
          </div>
          <aside class="slide-notes">
            <div>
              <h3>${phase.subtitle}</h3>
              <p>${section.summary}</p>
            </div>
            <ul class="note-list">
              ${notes.map((note) => `<li>${note}</li>`).join('')}
            </ul>
          </aside>
        </div>
      `;
      gallery.querySelector('#slidePrev').addEventListener('click', () => showSlide(currentSlide - 1));
      gallery.querySelector('#slideNext').addEventListener('click', () => showSlide(currentSlide + 1));
      gallery.querySelector('#slideDetail').addEventListener('click', () => openViewer(item));
      gallery.querySelector('.slide-figure').addEventListener('dblclick', () => openViewer(item));
      const image = gallery.querySelector('.slide-image');
      const main = gallery.querySelector('.slide-main');
      const applyLayout = () => {
        const aspect = image.naturalWidth / image.naturalHeight;
        main.classList.toggle('is-wide', item.fullBleed || aspect > 1.85);
      };
      if (image.complete && image.naturalWidth) applyLayout();
      image.addEventListener('load', applyLayout, { once: true });
    }

    function render() {
      filteredSlides = buildSlides();
      if (currentSlide >= filteredSlides.length) currentSlide = 0;
      gallery.innerHTML = '';
      if (!filteredSlides.length) {
        empty.style.display = 'block';
        count.textContent = `当前显示 0 / ${allImages().length} 张图片`;
        return;
      }
      empty.style.display = 'none';
      gallery.innerHTML = '<section class="deck" aria-label="架构图翻页演示"></section>';
      document.querySelector('#metricSections').textContent = sections.length;
      document.querySelector('#metricImages').textContent = filteredSlides.length;
      count.textContent = `当前显示 ${filteredSlides.length} / ${allImages().length} 张图片`;
      showSlide(currentSlide);
    }

    function refreshImages() {
      for (const img of gallery.querySelectorAll('img[data-path]')) {
        if (img.dataset.path) img.src = cacheBusted(img.dataset.path);
      }
      if (currentImage) viewerImage.src = cacheBusted(currentImage.path);
      lastRefresh.textContent = `上次刷新：${new Date().toLocaleTimeString()}`;
    }

    function setRefreshTimer() {
      if (refreshTimer) window.clearInterval(refreshTimer);
      const delay = Number(intervalSelect.value);
      if (delay > 0) refreshTimer = window.setInterval(refreshImages, delay);
    }

    function openViewer(item) {
      currentImage = item;
      zoom = 1;
      viewerName.textContent = item.title;
      viewerPath.textContent = item.path;
      viewerImage.alt = item.title;
      viewerImage.src = cacheBusted(item.path);
      viewer.classList.add('open');
      applyZoom();
    }

    function closeViewer() {
      viewer.classList.remove('open');
      currentImage = null;
      viewerImage.removeAttribute('src');
    }

    function applyZoom() {
      viewerImage.style.transform = `scale(${zoom})`;
    }

    document.querySelector('#zoomIn').addEventListener('click', () => {
      zoom = Math.min(4, Math.round((zoom + 0.2) * 10) / 10);
      applyZoom();
    });

    document.querySelector('#zoomOut').addEventListener('click', () => {
      zoom = Math.max(0.2, Math.round((zoom - 0.2) * 10) / 10);
      applyZoom();
    });

    document.querySelector('#zoomFit').addEventListener('click', () => {
      zoom = 1;
      stage.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
      applyZoom();
    });

    document.querySelector('#openFile').addEventListener('click', () => {
      if (currentImage) window.open(encodeURI(currentImage.path), '_blank');
    });

    document.querySelector('#closeViewer').addEventListener('click', closeViewer);
    refreshButton.addEventListener('click', refreshImages);
    intervalSelect.addEventListener('change', setRefreshTimer);
    search.addEventListener('input', render);

    viewer.addEventListener('dblclick', (event) => {
      if (event.target === viewer || event.target === stage) closeViewer();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeViewer();
      if (!viewer.classList.contains('open')) {
        if (event.key === 'ArrowLeft' || event.key === 'PageUp') showSlide(currentSlide - 1);
        if (event.key === 'ArrowRight' || event.key === 'PageDown' || event.key === ' ') showSlide(currentSlide + 1);
        if (event.key === 'Home') showSlide(0);
        if (event.key === 'End') showSlide(filteredSlides.length - 1);
        return;
      }
      if (event.key === '+') document.querySelector('#zoomIn').click();
      if (event.key === '-') document.querySelector('#zoomOut').click();
      if (event.key === '0') document.querySelector('#zoomFit').click();
    });

    let dragStart = null;
    stage.addEventListener('pointerdown', (event) => {
      if (!viewer.classList.contains('open')) return;
      dragStart = {
        x: event.clientX,
        y: event.clientY,
        left: stage.scrollLeft,
        top: stage.scrollTop
      };
      stage.classList.add('dragging');
      stage.setPointerCapture(event.pointerId);
    });

    stage.addEventListener('pointermove', (event) => {
      if (!dragStart) return;
      stage.scrollLeft = dragStart.left - (event.clientX - dragStart.x);
      stage.scrollTop = dragStart.top - (event.clientY - dragStart.y);
    });

    stage.addEventListener('pointerup', (event) => {
      dragStart = null;
      stage.classList.remove('dragging');
      stage.releasePointerCapture(event.pointerId);
    });

    render();
    refreshImages();
    setRefreshTimer();
  </script>
</body>
</html>
