    const app = document.querySelector("#app");
    const empty = document.querySelector("#empty");
    const search = document.querySelector("#search");
    const dateFilter = document.querySelector("#dateFilter");
    const tabs = [...document.querySelectorAll(".tab")];
    let active = "all";

    function typeClass(type) {
      return type.toLowerCase();
    }

    function render() {
      const query = search.value.trim().toLowerCase();
      const selectedDate = dateFilter.value;
      const visible = reports.filter((report) => {
        const inCategory = active === "all" || report.category === active;
        const inDate = selectedDate === "all" || report.date === selectedDate;
        const haystack = [report.category, report.area, report.date, report.title, report.description, report.path, ...report.files.flat()].join(" ").toLowerCase();
        return inCategory && inDate && (!query || haystack.includes(query));
      });
      app.innerHTML = "";
      empty.classList.toggle("hidden", visible.length !== 0);
      for (const category of ["大厂动态", "开源软件分析", "学术论文分析"]) {
        const group = visible.filter((report) => report.category === category);
        if (!group.length) continue;
        const section = document.createElement("section");
        section.innerHTML = `<div class="section-title"><h2>${category}</h2><span>${group.length} 个报告</span></div><div class="grid"></div>`;
        const grid = section.querySelector(".grid");
        for (const report of group) {
          const htmlFiles = report.files.filter(([type]) => type === "HTML").length;
          const pptxFiles = report.files.filter(([type]) => type === "PPTX").length;
          const card = document.createElement("article");
          card.className = "card";
          card.innerHTML = `
            <div class="meta"><span>${report.area}</span><span>${report.date}</span></div>
            <h3 class="title">${report.title}</h3>
            <p class="desc">${report.description}</p>
            <div class="links">
              ${report.files.map(([type, label, href]) => `<a class="link ${typeClass(type)}" href="${href}" target="_blank" rel="noopener"><span>${type}</span><strong>${label}</strong></a>`).join("")}
            </div>
            <details>
              <summary>文件信息：${htmlFiles} HTML / ${pptxFiles} PPTX</summary>
              <ul class="file-list">
                <li>目录：${report.path}</li>
                ${report.note ? `<li>说明：${report.note}</li>` : ""}
                ${report.files.map(([type, label, href]) => `<li>${type} · ${label} · ${href}</li>`).join("")}
              </ul>
            </details>
          `;
          grid.appendChild(card);
        }
        app.appendChild(section);
      }
    }

    function updateStats() {
      const html = reports.reduce((sum, report) => sum + report.files.filter(([type]) => type === "HTML").length, 0);
      const pptx = reports.reduce((sum, report) => sum + report.files.filter(([type]) => type === "PPTX").length, 0);
      document.querySelector("#reportCount").textContent = reports.length;
      document.querySelector("#htmlCount").textContent = html;
      document.querySelector("#pptxCount").textContent = pptx;
    }

    function populateDateFilter() {
      const dates = [...new Set(reports.map((report) => report.date))].sort().reverse();
      for (const date of dates) {
        const option = document.createElement("option");
        option.value = date;
        option.textContent = date.replace(/(\d{4})(\d{2})(\d{2})/, "$1-$2-$3");
        dateFilter.appendChild(option);
      }
    }

    search.addEventListener("input", render);
    dateFilter.addEventListener("change", render);
    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        active = tab.dataset.filter;
        tabs.forEach((item) => item.setAttribute("aria-pressed", String(item === tab)));
        render();
      });
    });
    populateDateFilter();
    updateStats();
    render();
  </script>
